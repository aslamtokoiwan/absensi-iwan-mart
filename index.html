<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Absensi IWAN MART</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 20px;
}

.box {
  max-width: 430px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

input:focus {
  outline: none;
  border-color: #1a73e8;
}

button {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 15px;
  border-radius: 9px;
  border: none;
  font-size: 16px;
  background: #1a73e8;
  color: white;
  font-weight: bold;
}

button:disabled {
  background: #999;
}

.btn-masuk {
  background: #188038;
}

.btn-pulang {
  background: #d93025;
}

video {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  background: black;
  display: block;
}

canvas {
  display: none;
}

.status {
  margin-top: 10px;
  text-align: center;
  font-weight: bold;
}

.info {
  background: #f1f3f4;
  padding: 12px;
  margin-top: 15px;
  border-radius: 10px;
  line-height: 1.7;
}

.garis {
  border: 0;
  border-top: 1px solid #ddd;
  margin: 25px 0;
}

</style>

</head>

<body>

<div class="box">

<h2>ABSENSI IWAN MART</h2>


<!-- DATA KARYAWAN -->

<label for="nik">
NIK Karyawan
</label>

<input
  type="text"
  id="nik"
  placeholder="Contoh: TIMPP001"
  autocomplete="off"
  autocapitalize="characters"
  spellcheck="false"
  oninput="cariKaryawan()"
>


<div
  id="statusNIK"
  class="status"
>
Silakan masukkan NIK
</div>


<div
  id="dataKaryawan"
  class="info"
  style="display:none;"
>

<b>Nama:</b>
<span id="namaKaryawan">-</span>

<br>

<b>NIK:</b>
<span id="nikTampil">-</span>

</div>


<!-- WAKTU -->

<div
  id="waktu"
  class="info"
>
Tanggal & Jam: -
</div>


<!-- GPS -->

<hr class="garis">

<label>
Lokasi GPS
</label>

<button
  type="button"
  onclick="ambilLokasi()"
>
📍 AMBIL LOKASI
</button>

<div
  id="statusGPS"
  class="status"
>
Lokasi belum diambil
</div>


<div
  id="lokasiTampil"
  class="info"
  style="display:none;"
>

<b>Latitude:</b>
<span id="latitude">-</span>

<br>

<b>Longitude:</b>
<span id="longitude">-</span>

<br>

<b>Akurasi:</b>
<span id="akurasi">-</span> meter

</div>


<!-- KAMERA -->

<hr class="garis">

<label>
Foto Selfie
</label>

<video
  id="video"
  autoplay
  playsinline
  muted
></video>


<button
  type="button"
  id="btnKamera"
  onclick="bukaKamera()"
>
📷 BUKA KAMERA
</button>


<button
  type="button"
  id="btnSelfie"
  onclick="ambilFoto()"
  disabled
>
🤳 AMBIL SELFIE
</button>


<canvas id="canvas"></canvas>


<div
  id="statusFoto"
  class="status"
>
Kamera belum dibuka
</div>


<!-- ABSENSI -->

<hr class="garis">

<button
  type="button"
  class="btn-masuk"
  onclick="prosesAbsen('MASUK')"
>
🟢 ABSEN MASUK
</button>


<button
  type="button"
  class="btn-pulang"
  onclick="prosesAbsen('PULANG')"
>
🔴 ABSEN PULANG
</button>


<div
  id="statusAbsen"
  class="status"
>
Belum melakukan absensi
</div>

</div>


<script>


/* ================================
   DATA KARYAWAN
================================ */


/*
  UNTUK SEMENTARA CONTOH DATA.

  NANTI BAGIAN INI KITA GANTI
  DENGAN DATA KARYAWAN IWAN MART.
*/

var daftarKaryawan = {

  "TIMPP001": "NISA",

  "TIMI2001": "APRIL",

  "TIMI3001": "GIFSY"

};

/* ================================
   VARIABEL
================================ */

var stream = null;

var fotoBase64 = "";

var latitude = "";

var longitude = "";

var akurasi = "";

var namaKaryawan = "";


/* ================================
   JAM REAL TIME
================================ */

function tampilkanWaktu() {

  var sekarang = new Date();

  var tanggal =
    String(sekarang.getDate()).padStart(2, "0")
    + "-"
    + String(sekarang.getMonth() + 1).padStart(2, "0")
    + "-"
    + sekarang.getFullYear();

  var jam =
    String(sekarang.getHours()).padStart(2, "0")
    + ":"
    + String(sekarang.getMinutes()).padStart(2, "0")
    + ":"
    + String(sekarang.getSeconds()).padStart(2, "0");

  document.getElementById("waktu").innerHTML =
    "Tanggal & Jam: <b>"
    + tanggal
    + " "
    + jam
    + "</b>";

}

setInterval(tampilkanWaktu, 1000);

tampilkanWaktu();


/* ================================
   CARI KARYAWAN BERDASARKAN NIK
================================ */

function cariKaryawan() {

  var nik =
    document.getElementById("nik").value.trim();

  var status =
    document.getElementById("statusNIK");

  var data =
    document.getElementById("dataKaryawan");


  if (nik === "") {

    namaKaryawan = "";

    data.style.display = "none";

    status.innerHTML =
      "Silakan masukkan NIK";

    status.style.color = "black";

    return;

  }


  if (daftarKaryawan[nik]) {

    namaKaryawan =
      daftarKaryawan[nik];

    document.getElementById(
      "namaKaryawan"
    ).innerText =
      namaKaryawan;

    document.getElementById(
      "nikTampil"
    ).innerText =
      nik;

    data.style.display =
      "block";

    status.innerHTML =
      "✅ NIK ditemukan";

    status.style.color =
      "green";

  } else {

    namaKaryawan = "";

    data.style.display =
      "none";

    status.innerHTML =
      "❌ NIK tidak ditemukan";

    status.style.color =
      "red";

  }

}


/* ================================
   GPS
================================ */

function ambilLokasi() {

  var status =
    document.getElementById("statusGPS");


  if (!navigator.geolocation) {

    status.innerHTML =
      "❌ HP tidak mendukung GPS.";

    status.style.color =
      "red";

    return;

  }


  status.innerHTML =
    "⏳ Mengambil lokasi...";

  status.style.color =
    "orange";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;

      akurasi =
        Math.round(
          position.coords.accuracy
        );


      document.getElementById(
        "latitude"
      ).innerText =
        latitude;

      document.getElementById(
        "longitude"
      ).innerText =
        longitude;

      document.getElementById(
        "akurasi"
      ).innerText =
        akurasi;


      document.getElementById(
        "lokasiTampil"
      ).style.display =
        "block";


      status.innerHTML =
        "✅ Lokasi berhasil diambil";

      status.style.color =
        "green";

    },


    function(error) {

      console.error(error);


      status.innerHTML =
        "❌ Gagal mengambil lokasi. Izinkan GPS pada browser.";

      status.style.color =
        "red";

    },


    {
      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}


/* ================================
   BUKA KAMERA
================================ */

function bukaKamera() {

  var video =
    document.getElementById("video");

  var btnSelfie =
    document.getElementById("btnSelfie");

  var status =
    document.getElementById("statusFoto");


  status.innerHTML =
    "⏳ Membuka kamera...";


  status.style.color =
    "orange";


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.innerHTML =
      "❌ Browser tidak mendukung kamera.";

    status.style.color =
      "red";

    return;

  }


  navigator.mediaDevices.getUserMedia({

    video: {

      facingMode: {

        ideal: "user"

      }

    },

    audio: false

  })

  .then(function(mediaStream) {

    stream =
      mediaStream;

    video.srcObject =
      mediaStream;

    video.play();


    btnSelfie.disabled =
      false;


    status.innerHTML =
      "✅ Kamera aktif. Arahkan wajah ke kamera.";

    status.style.color =
      "green";

  })


  .catch(function(error) {

    console.error(error);


    status.innerHTML =
      "❌ Kamera gagal: "
      + error.name;

    status.style.color =
      "red";

  });

}


/* ================================
   AMBIL FOTO SELFIE
================================ */

function ambilFoto() {

  if (!stream) {

    alert(
      "Silakan buka kamera terlebih dahulu."
    );

    return;

  }


  var video =
    document.getElementById("video");

  var canvas =
    document.getElementById("canvas");


  if (
    video.videoWidth === 0 ||
    video.videoHeight === 0
  ) {

    alert(
      "Kamera belum siap."
    );

    return;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  var context =
    canvas.getContext("2d");


  context.drawImage(

    video,

    0,

    0,

    canvas.width,

    canvas.height

  );


  fotoBase64 =
    canvas.toDataURL(

      "image/jpeg",

      0.85

    );


  document.getElementById(
    "statusFoto"
  ).innerHTML =

    "✅ SELFIE BERHASIL DIAMBIL";


  document.getElementById(
    "statusFoto"
  ).style.color =

    "green";


  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

  }

}


/* ================================
   PROSES ABSEN
================================ */

function prosesAbsen(jenis) {

  var nik =
    document.getElementById("nik")
      .value
      .trim();


  var status =
    document.getElementById("statusAbsen");


  /* CEK NIK */

  if (
    nik === "" ||
    !namaKaryawan
  ) {

    alert(
      "Masukkan NIK karyawan yang benar terlebih dahulu."
    );

    return;

  }


  /* CEK FOTO */

  if (fotoBase64 === "") {

    alert(
      "Silakan ambil selfie terlebih dahulu."
    );

    return;

  }


  /* CEK GPS */

  if (
    latitude === "" ||
    longitude === ""
  ) {

    alert(
      "Silakan ambil lokasi GPS terlebih dahulu."
    );

    return;

  }


  /* WAKTU */

  var sekarang =
    new Date();


  var tanggal =
    String(
      sekarang.getDate()
    ).padStart(2, "0")
    + "-"
    + String(
      sekarang.getMonth() + 1
    ).padStart(2, "0")
    + "-"
    + sekarang.getFullYear();


  var jam =
    String(
      sekarang.getHours()
    ).padStart(2, "0")
    + ":"
    + String(
      sekarang.getMinutes()
    ).padStart(2, "0")
    + ":"
    + String(
      sekarang.getSeconds()
    ).padStart(2, "0");


  /* TAMPILKAN HASIL */

  status.innerHTML =
    "✅ ABSEN "
    + jenis
    + " BERHASIL<br><br>"
    + "NIK: "
    + nik
    + "<br>"
    + "Nama: "
    + namaKaryawan
    + "<br>"
    + "Tanggal: "
    + tanggal
    + "<br>"
    + "Jam: "
    + jam
    + "<br>"
    + "GPS: "
    + latitude
    + ", "
    + longitude;


  status.style.color =
    "green";


  /*
    DATA INI NANTI AKAN
    DIKIRIM KE GOOGLE SHEETS.
  */

  console.log({

    nik: nik,

    nama: namaKaryawan,

    jenis: jenis,

    tanggal: tanggal,

    jam: jam,

    latitude: latitude,

    longitude: longitude,

    akurasi: akurasi,

    foto: fotoBase64

  });

}


</script>

</body>
</html>
