<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Iwan Mart</title>
<style>
:root{--biru:#1a73e8;--hijau:#188038;--merah:#d93025;--abu:#5f6368;--garis:#dadce0}
*{box-sizing:border-box}
body{margin:0;background:#f1f3f4;font-family:Roboto,Arial,sans-serif;color:#202124}
main{max-width:480px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
h1{margin:0;text-align:center;font-size:21px}
#jam{text-align:center;font-size:34px;font-weight:700;margin-top:6px}
#tgl{text-align:center;color:var(--abu);font-size:14px}
.judul{font-weight:700;margin-bottom:8px}
.no{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:var(--biru);color:#fff;font-size:14px;margin-right:6px}
input[type=text]{width:100%;font-size:22px;padding:12px;border:1px solid var(--garis);border-radius:10px;text-transform:uppercase;letter-spacing:1px}
.info{margin-top:10px;font-size:16px;min-height:22px}
.info b{font-size:19px}
.ok{color:var(--hijau)}.err{color:var(--merah)}.abu{color:var(--abu)}
button{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;color:#fff;background:var(--biru);cursor:pointer}
button.kecil{background:#e8eaed;color:#202124;font-size:14px;padding:10px;margin-top:8px}
button.hijau{background:var(--hijau)}button.merah{background:var(--merah)}
button:disabled{background:#bdc1c6;color:#fff;cursor:not-allowed}
#preview{display:none;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:10px}
#hasil{display:none;text-align:center}
#hasil .besar{font-size:54px}
#hasil .nama{font-size:20px;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>ABSENSI IWAN MART</h1>
    <div id="jam">--:--:--</div>
    <div id="tgl"></div>
  </div>

  <div id="form">
    <div class="card">
      <div class="judul"><span class="no">1</span>NIK Karyawan</div>
      <input id="nik" type="text" placeholder="Contoh: TIMPP001" autocomplete="off" autocapitalize="characters">
      <div id="info" class="info abu">Masukkan NIK Anda</div>
    </div>

    <div class="card">
      <div class="judul"><span class="no">2</span>Lokasi</div>
      <div id="lokasi" class="info abu">Mengambil lokasi...</div>
      <button class="kecil" id="btnLokasi" type="button">Ambil ulang lokasi</button>
    </div>

    <div class="card">
      <div class="judul"><span class="no">3</span>Foto Selfie</div>
      <input id="file" type="file" accept="image/*" capture="user" hidden>
      <button id="btnSelfie" type="button">AMBIL SELFIE</button>
      <img id="preview" alt="Foto selfie">
    </div>

    <div class="card">
      <button id="btnAksi" type="button" disabled>ABSEN</button>
      <div id="pesan" class="info"></div>
    </div>
  </div>

  <div id="hasil" class="card">
    <div class="besar">&#10004;&#65039;</div>
    <div class="nama" id="hNama"></div>
    <div id="hAksi" class="info"></div>
    <div id="hKet" class="info abu"></div>
    <button id="btnSelesai" type="button" class="hijau" style="margin-top:12px">SELESAI</button>
  </div>
</main>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbzH1EqhF32fvPE5e5awqsYoa0BhB3SJcA6LoEGWNHR5cWcpxBO0EIU1sb3YPr3LYiA/exec';   // URL dari Apps Script (Deploy > Web app), berakhiran /exec

var S = { kar: null, lok: null, foto: null, jarak: null, cid: null, sibuk: false, cariKe: 0 };
var $ = function (id) { return document.getElementById(id); };

/* ---------- jam ---------- */
function tick() {
  var d = new Date();
  $('jam').textContent = d.toLocaleTimeString('id-ID', { hour12: false }).replace(/\./g, ':');
  $('tgl').textContent = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(tick, 1000); tick();

/* ---------- util ---------- */
function jarak(lat1, lng1, lat2, lng2) {
  var R = 6371000, r = Math.PI / 180, dLa = (lat2 - lat1) * r, dLo = (lng2 - lng1) * r;
  var a = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function setHtml(id, teks, kelas) { var e = $(id); e.textContent = teks; e.className = 'info ' + (kelas || 'abu'); }

/* ---------- 1. NIK ---------- */
var tunda = null;
$('nik').addEventListener('input', function () {
  this.value = this.value.toUpperCase().replace(/\s/g, '');
  clearTimeout(tunda); tunda = setTimeout(cari, 500);
});
async function cari() {
  var nik = $('nik').value.trim(), token = ++S.cariKe;
  S.kar = null; segarkan();
  if (nik.length < 4) { setHtml('info', 'Masukkan NIK Anda'); return; }
  setHtml('info', 'Mencari...');
  try {
    var res = await fetch(API_URL + '?api=cari&nik=' + encodeURIComponent(nik));
    var r = await res.json();
    if (token !== S.cariKe) return;
    if (!r.ok) { setHtml('info', r.pesan, 'err'); return; }
    S.kar = r; localStorage.setItem('nik', nik);
    var e = $('info'); e.className = 'info';
    e.innerHTML = '';
    var b = document.createElement('b'); b.textContent = r.nama; e.appendChild(b);
    e.appendChild(document.createElement('br'));
    e.appendChild(document.createTextNode(r.toko + ' \u2022 ' + r.shift));
    if (r.terakhir) {
      e.appendChild(document.createElement('br'));
      var t = document.createElement('span'); t.className = 'abu';
      t.textContent = 'Terakhir: ' + r.terakhir.jenis + ' ' + r.terakhir.jam.substr(0, 5) + ' (' + r.terakhir.tgl + ')';
      e.appendChild(t);
    }
    segarkan();
  } catch (err) {
    if (token === S.cariKe) setHtml('info', 'Gagal terhubung. Periksa internet Anda.', 'err');
  }
}

/* ---------- 2. Lokasi ---------- */
function ambilLokasi() {
  S.lok = null; S.jarak = null; setHtml('lokasi', 'Mengambil lokasi...'); segarkan();
  if (!navigator.geolocation) { setHtml('lokasi', 'Perangkat tidak mendukung GPS', 'err'); return; }
  navigator.geolocation.getCurrentPosition(function (p) {
    S.lok = { lat: p.coords.latitude, lng: p.coords.longitude, akurasi: p.coords.accuracy };
    segarkan();
  }, function (e) {
    setHtml('lokasi', e.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini.' : 'Lokasi gagal diambil. Coba lagi di tempat terbuka.', 'err');
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}
$('btnLokasi').addEventListener('click', ambilLokasi);

/* ---------- 3. Selfie ---------- */
$('btnSelfie').addEventListener('click', function () { $('file').click(); });
$('file').addEventListener('change', async function () {
  var f = this.files && this.files[0]; if (!f) return;
  try {
    S.foto = await prosesFoto(f, $('nik').value.trim());
    $('preview').src = S.foto; $('preview').style.display = 'block';
    $('btnSelfie').textContent = 'AMBIL ULANG SELFIE';
  } catch (e) { S.foto = null; setHtml('pesan', 'Foto gagal diproses. Coba lagi.', 'err'); }
  this.value = ''; segarkan();
});
function prosesFoto(file, nik) {
  return new Promise(function (ok, gagal) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 640 / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      var x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, c.height - 26, c.width, 26);
      x.fillStyle = '#fff'; x.font = '14px Arial';
      x.fillText(nik + '   ' + new Date().toLocaleString('id-ID'), 8, c.height - 8);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = function () { gagal(new Error('foto')); };
    img.src = url;
  });
}

/* ---------- status tombol ---------- */
function segarkan() {
  var k = S.kar, tombol = $('btnAksi'), lokOk = false;
  if (S.lok) {
    if (k && k.lokasiToko) {
      S.jarak = jarak(S.lok.lat, S.lok.lng, k.lokasiToko.lat, k.lokasiToko.lng);
      lokOk = S.jarak <= k.lokasiToko.radius;
      setHtml('lokasi', lokOk ? 'Di area toko (' + Math.round(S.jarak) + ' m)' : 'Terlalu jauh dari toko: ' + Math.round(S.jarak) + ' m (batas ' + k.lokasiToko.radius + ' m)', lokOk ? 'ok' : 'err');
    } else {
      lokOk = !k;   // belum ada NIK: tunggu
      setHtml('lokasi', 'Lokasi didapat (akurasi \u00b1' + Math.round(S.lok.akurasi) + ' m)', 'ok');
      if (k && !k.lokasiToko) setHtml('lokasi', 'Koordinat toko belum diatur. Hubungi pemilik.', 'err');
    }
  }
  var siap = !!(k && S.lok && S.foto && lokOk && !S.sibuk);
  tombol.disabled = !siap;
  tombol.textContent = S.sibuk ? 'Mengirim...' : (k ? 'ABSEN ' + k.aksi : 'ABSEN');
  tombol.className = k ? (k.aksi === 'MASUK' ? 'hijau' : 'merah') : '';
}

/* ---------- kirim ---------- */
$('btnAksi').addEventListener('click', async function () {
  if (!S.kar || S.sibuk) return;
  S.sibuk = true; setHtml('pesan', ''); segarkan();
  if (!S.cid) S.cid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
  try {
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ api: 'simpan', cid: S.cid, nik: S.kar.nik, aksi: S.kar.aksi,
        lat: S.lok.lat, lng: S.lok.lng, akurasi: S.lok.akurasi, foto: S.foto })
    });
    var r = await res.json();
    S.sibuk = false;
    if (!r.ok) { S.cid = null; setHtml('pesan', r.pesan, 'err'); segarkan(); return; }
    S.cid = null;
    $('hNama').textContent = r.nama;
    $('hAksi').textContent = 'ABSEN ' + r.aksi + ' pukul ' + r.jam.substr(0, 5);
    $('hAksi').className = 'info ok';
    $('hKet').textContent = r.keterangan || '';
    $('form').style.display = 'none'; $('hasil').style.display = 'block';
  } catch (err) {
    S.sibuk = false;   // cid dipertahankan: jika terkirim ulang tidak akan tercatat ganda
    setHtml('pesan', 'Koneksi terputus. Tekan tombol lagi untuk mengirim ulang.', 'err'); segarkan();
  }
});
$('btnSelesai').addEventListener('click', function () {
  S.foto = null; $('preview').style.display = 'none'; $('btnSelfie').textContent = 'AMBIL SELFIE';
  $('hasil').style.display = 'none'; $('form').style.display = 'block';
  setHtml('pesan', ''); cari(); ambilLokasi();
});

/* ---------- mulai ---------- */
var nikTersimpan = localStorage.getItem('nik');
if (nikTersimpan) { $('nik').value = nikTersimpan; cari(); }
ambilLokasi();
</script>
</body>
</html>
